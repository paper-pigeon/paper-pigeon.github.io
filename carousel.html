<main role="main" class="container-fluid">
    <h2>Carousel</h2>
    <hr class="dashedrule">
<!--Add carousel here-->
<!--requirements: 4 og images, captions, previous and next buttons-->

<section aria-label="Illustration Carousel">
    <div class="carousel-container">
        <div class="carousel" data-carousel>
            <button class="carousel-button prev" data-carousel-button="prev">&#8592;</button>
            <button class="carousel-button next" data-carousel-button="next">&#8594;</button>
            <ul data-slides>
                <li class="slide" data-active>
                    <img src="images/berryfairy.png" alt="an illustration of a fairy with berries">
                    <div class="caption">"Blackberry Fairy", digital, procreate, 2024</div>
                </li>
                <li class="slide">
                    <img src="images/hangoutscene.png" alt="an illustration of a couple hanging out">
                    <div class="caption">"Eveningtime", mixed media, 2024 </div>
                </li>
                <li class="slide">
                    <img src="images/sillyselfportrait.png" alt="a cartoony self-portrait">
                    <div class="caption">"Silly Self-Portrait", mixed media, 2024</div>
                </li>
                <li class="slide">
                    <img src="images/stridingdeer.png" alt="a black and white illustration of a deer in motion">
                    <div class="caption">"Crossing", mixed media, 2024</div>
                </li>
            </ul>
        </div>
    </div>
</section>
